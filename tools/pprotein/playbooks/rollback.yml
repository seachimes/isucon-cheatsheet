---
- name: Restore an agent deployment snapshot
  hosts: pprotein_agents
  become: true
  gather_facts: false
  tasks:
    - name: Require a single target and snapshot ID
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - change_id is defined
          - change_id is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$')
    - name: Restore files and original service state
      ansible.builtin.command:
        argv: [python3, /var/lib/isucon-pprotein-manager/recovery.py, restore, "{{ change_id }}"]
      when: not ansible_check_mode
      changed_when: true
