---
# 計測基盤の secret。このファイルをコピーして secrets.yml を作る。
#   cp secrets.example.yml secrets.yml
# secrets.yml は gitignore 済み（コミットされない）。
#
# 値は pprotein-infra/terraform/cloudflare の出力から取得する:
#   terraform -chdir=pprotein-infra/terraform/cloudflare output -json agent_tunnel_tokens

# agent トンネルの run token（ラベル -> トークン）。
# ラベルは pprotein-infra の agent_hosts（例: ["1","2","3"]）に対応する。
# inventory の各ホストに pprotein_agent_label を付けて参照する。
pprotein_agent_tunnel_tokens:
  "1": "REPLACE_ME"
  "2": "REPLACE_ME"
  "3": "REPLACE_ME"
